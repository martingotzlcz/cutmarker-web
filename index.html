<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cutmarker</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#0b0b0d;--tx:#ededf0;--tx2:#9b9ba6;--tx3:#6b6b76;--pur2:#a99cff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  svg.mark{width:66px;height:auto;margin-bottom:22px}
  h1{font-size:26px;letter-spacing:-.02em;font-weight:700}
  .soon{color:var(--pur2);font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:16px}
  footer{position:fixed;bottom:0;left:0;right:0;padding:20px;color:var(--tx3);font-size:12.5px}
  footer a{color:var(--tx3);text-decoration:none}footer a:hover{color:var(--tx2)}
</style>
</head>
<body>
  <svg class="mark" viewBox="-43 -46 86 46" fill="none" role="img" aria-label="Cutmarker">
    <mask id="ntch"><rect x="-58" y="-56" width="116" height="60" fill="#fff"/><circle cx="0" cy="-26" r="12" fill="#000"/></mask>
    <g mask="url(#ntch)">
      <rect x="9" y="-46" width="8" height="46" rx="4" fill="#DDE1EC"/><rect x="-17" y="-46" width="8" height="46" rx="4" fill="#DDE1EC"/>
      <rect x="22" y="-34" width="8" height="34" rx="4" fill="#A7AEC2"/><rect x="-30" y="-34" width="8" height="34" rx="4" fill="#A7AEC2"/>
      <rect x="35" y="-22" width="8" height="22" rx="4" fill="#6E7591"/><rect x="-43" y="-22" width="8" height="22" rx="4" fill="#6E7591"/>
    </g>
    <rect x="-3.5" y="-22" width="7" height="22" rx="3.5" fill="#6B5BFF"/><circle cx="0" cy="-26" r="7.5" fill="#6B5BFF"/>
  </svg>
  <h1>Cutmarker</h1>
  <div class="soon">Coming soon</div>
  <footer><a href="/legal.html">Terms &amp; Privacy</a> &nbsp;&middot;&nbsp; support@cutmarker.com</footer>
</body>
</html>
